name: Apply Rogue Rita monetization

on:
  push:
    branches: [v3]
    paths:
      - '.github/workflows/apply-rr-monetization.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3
      - name: Apply live Stripe support patch
        run: python tools/rr_monetize.py
      - name: Validate release invariants
        run: |
          test -f index.html
          test -f games/RogueRita_VaporwaveV1.html
          test -f games/RogueRita_v2_Vaporwave.html
          test -f games/RogueRita_CyberArena_BossPackV1.html
          test "$(grep -o 'https://buy.stripe.com/6oU4gz9cfcwG1FG4Qw0oM0x' index.html | wc -l)" -eq 2
          grep -q 'BACK RITA' index.html
          grep -q 'OPTIONAL SUPPORT · SAME GAMES' index.html
          grep -q 'mobile-stick' games/RogueRita_VaporwaveV1.html
          grep -q 'mobile-stick' games/RogueRita_v2_Vaporwave.html
          grep -q 'mobile-stick' games/RogueRita_CyberArena_BossPackV1.html
          ! find games -name '*_core.html' | grep -q .
          test ! -e games/mobile-play.html
          test ! -e games/mobile.html
      - name: Validate game JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          for p in Path('games').glob('RogueRita_*.html'):
              scripts=re.findall(r'<script>(.*?)</script>',p.read_text(),re.S)
              if len(scripts)!=1: raise SystemExit(f'{p}: expected one script, got {len(scripts)}')
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False) as f:
                  f.write(scripts[0]); name=f.name
              subprocess.run(['node','--check',name],check=True)
          PY
      - name: Commit final monetized v3
        run: |
          git config user.name 'BNDRBOTS'
          git config user.email 'bndrbots@gmail.com'
          git rm -f tools/rr_monetize.py .github/workflows/apply-rr-monetization.yml
          git add -A
          git commit -m 'Monetize Rogue Rita with optional Stripe support'
          git push origin HEAD:v3
